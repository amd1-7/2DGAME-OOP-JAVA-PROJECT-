name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y xvfb maven
      - run: xvfb-run -a mvn -B test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
      - run: mvn -B versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
      - run: mvn -B package -DskipTests
      - run: |
          JAR=$(ls target/*.jar | grep -v original | head -n 1)
          cp "$JAR" "Qadar-${VERSION}.jar"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: Qadar-${{ env.VERSION }}.jar
